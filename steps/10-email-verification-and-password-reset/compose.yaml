# Mailpit: a fake mail server with a web inbox, for development only.
# Every email the portal sends lands here instead of a real inbox.
#   SMTP (the app sends to it):  127.0.0.1:18825
#   Web inbox (you open it):     http://localhost:18826
name: auab
services:
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: auab-mailpit
    ports:
      - "127.0.0.1:18825:1025"
      - "127.0.0.1:18826:8025"
    environment:
      MP_MAX_MESSAGES: 500
